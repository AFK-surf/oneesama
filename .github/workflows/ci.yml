name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MAB_BROWSER_HEADLESS: "true"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npx vp lint --deny-warnings .
      - run: npx vp test run
      - run: npx vp exec tsc --noEmit
      - run: make vet
      - run: make build
      - run: make test
